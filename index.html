<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Java Island Adventure</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: row;
      font-family: monospace;
      background: #222;
      color: #0f0;
    }
    #left-panel, #right-panel {
      padding: 20px;
    }
    #left-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      background: #111;
    }
    #right-panel {
      flex: 1;
      background: #000;
      border-left: 2px solid #0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #output {
      flex: 1;
      white-space: pre-wrap;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #000;
      padding: 10px;
      border: 1px solid #0f0;
    }
    select, input[type="text"] {
      padding: 10px;
      background: #000;
      color: #0f0;
      border: 1px solid #0f0;
      font-family: monospace;
      font-size: 16px;
      margin-bottom: 10px;
    }
    img {
      max-width: 100%;
      border: 1px solid #0f0;
      background: #000;
    }
    .box {
      border: 1px solid #0f0;
      padding: 10px;
      width: 100%;
      background: #111;
    }
    .button-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      background: #111;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 5px 10px;
      font-family: monospace;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      #left-panel, #right-panel {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="left-panel">
    <div id="output">Welcome to the Java Island Adventure. Type "look" or use the dropdown to begin your journey.Available commands include:

look

go [direction] (e.g. go east)

take [item]

talk to [npc]

save

load</div> <select id="command-select"> <option value="">-- Select a command --</option> </select> <input type="text" id="command" placeholder="Type a command..." autofocus />

  <div class="button-bar">
    <button onclick="saveGame()">Save</button>
    <button onclick="loadGame()">Load</button>
  </div>
</div>
<div id="right-panel">
  <img id="location-img" src="" alt="Location Image" />
  <div class="box" id="score">Score: 0</div>
  <div class="box" id="inventory">Inventory: (empty)</div>
  <div class="box" id="npc-box">People here: (none)</div>
  <audio id="bg-audio" loop autoplay></audio>
</div><script>
  const output = document.getElementById('output');
  const commandInput = document.getElementById('command');
  const inventoryBox = document.getElementById('inventory');
  const npcBox = document.getElementById('npc-box');
  const scoreBox = document.getElementById('score');
  const locationImg = document.getElementById('location-img');
  const bgAudio = document.getElementById('bg-audio');
  const commandSelect = document.getElementById('command-select');

  let currentRoom = 'jakarta';
  let inventory = [];
  let score = 0;

  const rooms = {
    jakarta: {
      description: "You are in Jakarta, the capital city of Indonesia, a bustling metropolis with deep colonial history.",
      exits: { east: 'bandung' },
      items: ['old coin'],
      npcs: { 'Historian': "Jakarta was once called Batavia during Dutch colonization." },
      image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Merdeka_Square_Monas_02.jpg/640px-Merdeka_Square_Monas_02.jpg',
      sound: ''
    },
    bandung: {
      description: "You are in Bandung, surrounded by colonial architecture and cool highlands.",
      exits: { west: 'jakarta', east: 'yogyakarta', south: 'malang', north: 'semarang' },
      items: ['map fragment'],
      npcs: {},
      image: 'https://upload.wikimedia.org/wikipedia/commons/9/99/Bandung_view.jpg',
      sound: ''
    },
    yogyakarta: {
      description: "You are in Yogyakarta, center of Javanese culture and home to the Sultan's Palace.",
      exits: { west: 'bandung', east: 'surabaya' },
      items: ['batik cloth'],
      npcs: { 'Local Guide': "This palace has housed Sultans for centuries." },
      image: 'https://upload.wikimedia.org/wikipedia/commons/f/f7/Kraton_Yogyakarta_%2823%29.JPG',
      sound: ''
    },
    malang: {
      description: "You are in Malang, known for its colonial-era buildings and scenic mountains.",
      exits: { north: 'bandung' },
      items: ['tea sample'],
      npcs: {},
      image: 'https://upload.wikimedia.org/wikipedia/commons/2/23/Alun-alun_Tugu_Malang.jpg',
      sound: ''
    },
    surabaya: {
      description: "You are in Surabaya, a historic port city known for its role in the Indonesian National Revolution.",
      exits: { west: 'yogyakarta' },
      items: ['revolution pamphlet'],
      npcs: { 'Veteran': "We fought bravely here in 1945 to defend our independence." },
      image: 'https://upload.wikimedia.org/wikipedia/commons/3/3e/Heroes_Monument_Surabaya.jpg',
      sound: ''
    },
    semarang: {
      description: "You are in Semarang, a coastal city with Dutch colonial landmarks and a thriving port.",
      exits: { south: 'bandung' },
      items: ['harbor key'],
      npcs: { 'Dock Worker': "The harbor dates back to the 17th century, bustling with trade." },
      image: 'https://upload.wikimedia.org/wikipedia/commons/f/f3/Simpang_Lima_Semarang_2017.jpg',
      sound: ''
    }
  };

  function updateUI() {
    const room = rooms[currentRoom];
    locationImg.src = room.image;
    bgAudio.src = room.sound;
    output.textContent += `\n\n${room.description}`;
    output.textContent += `\nExits: ${Object.keys(room.exits).join(', ')}`;
    inventoryBox.textContent = 'Inventory: ' + (inventory.length ? inventory.join(', ') : '(empty)');
    npcBox.textContent = 'People here: ' + (Object.keys(room.npcs).join(', ') || '(none)');
    scoreBox.textContent = 'Score: ' + score;
    updateCommandMenu();
  }

  function updateCommandMenu() {
    const room = rooms[currentRoom];
    commandSelect.innerHTML = '<option value="">-- Select a command --</option>';
    commandSelect.innerHTML += '<option value="look">look</option>';
    Object.keys(room.exits).forEach(dir => {
      commandSelect.innerHTML += `<option value="go ${dir}">go ${dir}</option>`;
    });
    room.items.forEach(item => {
      commandSelect.innerHTML += `<option value="take ${item}">take ${item}</option>`;
    });
    Object.keys(room.npcs).forEach(npc => {
      commandSelect.innerHTML += `<option value="talk to ${npc}">talk to ${npc}</option>`;
    });
  }

  function handleCommand(input) {
    const room = rooms[currentRoom];
    const cmd = input.trim().toLowerCase();

    if (cmd === 'look') {
      output.textContent += `\n\n${room.description}`;
      output.textContent += `\nExits: ${Object.keys(room.exits).join(', ')}`;
    } else if (cmd.startsWith('go ')) {
      const dir = cmd.split(' ')[1];
      if (room.exits[dir]) {
        currentRoom = room.exits[dir];
        output.textContent += `\n\nYou go ${dir}.`;
        updateUI();
      } else {
        output.textContent += `\n\nYou can't go ${dir} from here.`;
      }
    } else if (cmd.startsWith('take ')) {
      const item = cmd.slice(5);
      if (room.items.includes(item)) {
        inventory.push(item);
        room.items.splice(room.items.indexOf(item), 1);
        score += 10;
        output.textContent += `\n\nYou take the ${item}.`;
      } else {
        output.textContent += `\n\nThere's no ${item} here.`;
      }
      updateUI();
    } else if (cmd.startsWith('talk to ')) {
      const npc = cmd.slice(8).toLowerCase();
      const foundNpc = Object.keys(room.npcs).find(n => n.toLowerCase() === npc);
      if (foundNpc) {
        output.textContent += `\n\n${foundNpc} says: \"${room.npcs[foundNpc]}\"`;
      } else {
        output.textContent += `\n\nThere's no one named ${npc} here.`;
      }
    } else {
      output.textContent += "\n\nI don't understand that command.";
    }

    commandInput.value = '';
    output.scrollTop = output.scrollHeight;
  }

  function saveGame() {
    localStorage.setItem('javaGameSave', JSON.stringify({ currentRoom, inventory, score }));
    alert('Game saved!');
  }

  function loadGame() {
    const save = localStorage.getItem('javaGameSave');
    if (save) {
      const state = JSON.parse(save);
      currentRoom = state.currentRoom;
      inventory = state.inventory;
      score = state.score;
      output.textContent = `Game loaded.\n\n`;
      updateUI();
    } else {
      alert('No saved game found.');
    }
  }

  commandInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      handleCommand(commandInput.value);
    }
  });

  commandSelect.addEventListener('change', () => {
    const cmd = commandSelect.value;
    if (cmd) handleCommand(cmd);
  });

  updateUI();
</script>
</body>
</html>
