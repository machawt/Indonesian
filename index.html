<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bali Island Adventure</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
    #game-container { display: flex; flex-direction: column; max-width: 800px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #image-panel { height: 200px; background-size: cover; background-position: center; border-radius: 10px; margin-bottom: 15px; }
    #output { white-space: pre-wrap; margin-bottom: 10px; background: #eef; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
    #command-form { display: flex; flex-wrap: wrap; gap: 10px; }
    #command { flex: 1; padding: 8px; }
    button, select { padding: 8px; }
    audio { width: 100%; margin-top: 10px; }
    #inventory, #quest-log { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 5px; margin-top: 10px; }
    #inventory ul, #quest-log ul { list-style-type: none; padding: 0; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="image-panel"></div>
    <div id="output"></div>
    <form id="command-form">
      <select id="command-select"></select>
      <input type="text" id="command" placeholder="Type or select a command..." />
      <button type="submit">Go</button>
    </form>
    <audio id="audio" controls autoplay loop></audio>
    <div id="inventory">
      <h3>Inventory</h3>
      <ul id="inventory-list"></ul>
    </div>
    <div id="quest-log">
      <h3>Quest Log</h3>
      <ul id="quest-log-list"></ul>
    </div>
  </div>
  <script>
    const inventory = [];
    const quests = {
      "temple-blessing": false,
      "lost-necklace": false
    };

    const locations = {
      "Denpasar": {
        desc: "You are in the bustling capital of Bali, Denpasar. Festivals fill the air.",
        image: "https://example.com/denpasar.jpg",
        audio: "https://example.com/festival.mp3",
        directions: ["Ubud", "Kuta", "Sanur"],
        commands: ["go Ubud", "go Kuta", "go Sanur", "attend festival", "talk to elder"],
        onCommand(cmd) {
          if (cmd === "attend festival") return "You join the vibrant Galungan celebration!";
          if (cmd === "talk to elder") {
            quests["temple-blessing"] = true;
            return "The village elder asks you to receive a blessing at Besakih Temple.";
          }
        }
      },
      "Ubud": {
        desc: "You stand in lush Ubud, center of culture and temples.",
        image: "https://example.com/ubud.jpg",
        audio: "https://example.com/gamelan.mp3",
        directions: ["Denpasar", "Besakih Temple", "Tegallalang", "Monkey Forest"],
        commands: ["go Denpasar", "go Besakih Temple", "go Tegallalang", "go Monkey Forest", "observe art"],
        onCommand(cmd) {
          if (cmd === "observe art") return "You admire intricate Balinese paintings.";
        }
      },
      "Besakih Temple": {
        desc: "The Mother Temple of Bali stands before you at Mount Agung.",
        image: "https://example.com/besakih.jpg",
        audio: "https://example.com/templebells.mp3",
        directions: ["Ubud", "Mount Agung"],
        commands: ["go Ubud", "go Mount Agung", "offer prayer"],
        onCommand(cmd) {
          if (cmd === "offer prayer" && quests["temple-blessing"]) {
            inventory.push("Blessing Token");
            quests["temple-blessing"] = false;
            return "You receive a sacred token. The elder will be pleased.";
          }
          return "You offer a prayer and feel at peace.";
        }
      },
      "Monkey Forest": {
        desc: "Monkeys roam freely among ancient ruins in the Sacred Monkey Forest.",
        image: "https://example.com/monkeyforest.jpg",
        audio: "https://example.com/monkeys.mp3",
        directions: ["Ubud"],
        commands: ["go Ubud", "explore ruins", "offer banana"],
        onCommand(cmd) {
          if (cmd === "offer banana") return "The monkeys accept and let you pass into a hidden area.";
          if (cmd === "explore ruins") return "You find a strange necklace in the roots of a tree.";
        }
      },
      "Kuta": {
        desc: "You're at the beach town of Kuta, surfers and sunsets await.",
        image: "https://example.com/kuta.jpg",
        audio: "https://example.com/waves.mp3",
        directions: ["Denpasar", "Tulamben"],
        commands: ["go Denpasar", "go Tulamben", "watch sunset", "talk to tourist"],
        onCommand(cmd) {
          if (cmd === "watch sunset") return "The sunset over the ocean is breathtaking.";
          if (cmd === "talk to tourist") {
            quests["lost-necklace"] = true;
            return "A tourist has lost their necklace. Maybe it's in the Monkey Forest?";
          }
        }
      },
      "Tulamben": {
        desc: "You're at Tulamben dive site, home to a WWII shipwreck.",
        image: "https://example.com/tulamben.jpg",
        audio: "https://example.com/underwater.mp3",
        directions: ["Kuta", "Amed"],
        commands: ["go Kuta", "go Amed", "dive"],
        onCommand(cmd) {
          if (cmd === "dive") return "You dive and discover ancient coins hidden in coral.";
        }
      },
      "Mount Agung": {
        desc: "You stand on the slopes of Mount Agung, the tallest mountain in Bali.",
        image: "https://example.com/agung.jpg",
        audio: "https://example.com/wind.mp3",
        directions: ["Besakih Temple"],
        commands: ["go Besakih Temple", "climb"],
        onCommand(cmd) {
          if (cmd === "climb") return "You ascend and are rewarded with a panoramic sunrise.";
        }
      },
      "Sanur": {
        desc: "Sanur beach is peaceful with local fishing boats bobbing in the waves.",
        image: "https://example.com/sanur.jpg",
        audio: "https://example.com/seabreeze.mp3",
        directions: ["Denpasar"],
        commands: ["go Denpasar", "walk promenade"],
        onCommand(cmd) {
          if (cmd === "walk promenade") return "You stroll along the quiet promenade by the sea.";
        }
      },
      "Tegallalang": {
        desc: "You gaze over the famous rice terraces of Tegallalang, green and grand.",
        image: "https://example.com/tegallalang.jpg",
        audio: "https://example.com/birds.mp3",
        directions: ["Ubud"],
        commands: ["go Ubud", "explore terraces"],
        onCommand(cmd) {
          if (cmd === "explore terraces") return "You wander the terraces and meet friendly farmers.";
        }
      },
      "Amed": {
        desc: "Amed is a quiet fishing village known for its vibrant reefs.",
        image: "https://example.com/amed.jpg",
        audio: "https://example.com/calmsea.mp3",
        directions: ["Tulamben"],
        commands: ["go Tulamben", "snorkel"],
        onCommand(cmd) {
          if (cmd === "snorkel") return "You spot colorful fish and coral gardens.";
        }
      }
    };

    let currentLocation = "Denpasar";
    const output = document.getElementById("output");
    const commandInput = document.getElementById("command");
    const commandSelect = document.getElementById("command-select");
    const form = document.getElementById("command-form");
    const imagePanel = document.getElementById("image-panel");
    const audio = document.getElementById("audio");
    const inventoryList = document.getElementById("inventory-list");
    const questLogList = document.getElementById("quest-log-list");

    function updateUI() {
      const loc = locations[currentLocation];
      output.textContent = loc.desc;
      imagePanel.style.backgroundImage = `url('${loc.image}')`;
      audio.src = loc.audio;
      commandSelect.innerHTML = loc.commands.map(c => `<option value="${c}">${c}</option>`).join("");
      updateInventoryUI();
      updateQuestLogUI();
    }

    function updateInventoryUI() {
      inventoryList.innerHTML = inventory.map(item => `<li>${item}</li>`).join("");
    }

    function updateQuestLogUI() {
      questLogList.innerHTML = Object.keys(quests).map(quest => {
        return `<li>${quest}: ${quests[quest] ? "In Progress" : "Not Started"}</li>`;
      }).join("");
    }

    function processCommand(cmd) {
      cmd = cmd.toLowerCase();
      const loc = locations[currentLocation];
      if (cmd.startsWith("go ")) {
        const dest = cmd.slice(3).trim();
        if (loc.directions.includes(dest)) {
          currentLocation = dest;
          updateUI();
          return `You travel to ${dest}.`;
        } else {
          return "You can't go that way.";
        }
      }
      if (loc.onCommand) {
        const response = loc.onCommand(cmd);
        return response || "Nothing happens.";
      }
      return "Nothing happens.";
    }

    form.onsubmit = (e) => {
      e.preventDefault();
      const cmd = commandInput.value || commandSelect.value;
      const result = processCommand(cmd);
      output.textContent += `\n\n> ${cmd}\n${result}`;
      commandInput.value = "";
    };

    updateUI();
  </script>
</body>
</html>
