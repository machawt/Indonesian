<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bali Island Adventure</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f0f0;
      margin: 0;
      padding: 20px;
    }
    #game-container {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    #image-panel {
      height: 200px;
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      margin-bottom: 15px;
    }
    #output {
      white-space: pre-wrap;
      background: #eef;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    select, button {
      padding: 10px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="image-panel"></div>
    <div id="output"></div>
    <div>
      <select id="command-menu"></select>
      <button onclick="executeCommand()">Do Command</button>
    </div>
  </div>

  <script>
    const locations = {
      "Denpasar": {
        description: "You're in Denpasar, the capital city of Bali.",
        directions: ["Ubud", "Kuta", "Sanur"],
        commands: ["Look Around", "Talk to Local", "Go to Ubud", "Go to Kuta", "Go to Sanur"],
        image: "https://via.placeholder.com/800x200?text=Denpasar"
      },
      "Ubud": {
        description: "You're in Ubud, the cultural heart of Bali.",
        directions: ["Denpasar", "Monkey Forest"],
        commands: ["Look Around", "Visit Art Gallery", "Go to Denpasar", "Go to Monkey Forest"],
        image: "https://via.placeholder.com/800x200?text=Ubud"
      },
      "Kuta": {
        description: "You're at the beach in Kuta, full of surfers and nightlife.",
        directions: ["Denpasar"],
        commands: ["Look Around", "Surf the Waves", "Go to Denpasar"],
        image: "https://via.placeholder.com/800x200?text=Kuta"
      },
      "Sanur": {
        description: "You're in Sanur, a quieter seaside town.",
        directions: ["Denpasar"],
        commands: ["Look Around", "Relax on Beach", "Go to Denpasar"],
        image: "https://via.placeholder.com/800x200?text=Sanur"
      },
      "Monkey Forest": {
        description: "You're in the Monkey Forest near Ubud.",
        directions: ["Ubud"],
        commands: ["Look Around", "Feed the Monkeys", "Go to Ubud"],
        image: "https://via.placeholder.com/800x200?text=Monkey+Forest"
      }
    };

    let currentLocation = "Denpasar";

    function updateUI() {
      const loc = locations[currentLocation];
      document.getElementById("image-panel").style.backgroundImage = `url('${loc.image}')`;
      document.getElementById("output").textContent = loc.description;

      const commandMenu = document.getElementById("command-menu");
      commandMenu.innerHTML = "";
      loc.commands.forEach(cmd => {
        const option = document.createElement("option");
        option.value = cmd;
        option.textContent = cmd;
        commandMenu.appendChild(option);
      });
    }

    function executeCommand() {
      const selected = document.getElementById("command-menu").value;
      const output = document.getElementById("output");

      if (selected.startsWith("Go to ")) {
        const destination = selected.replace("Go to ", "");
        if (locations[currentLocation].directions.includes(destination)) {
          currentLocation = destination;
          updateUI();
          output.textContent += `\n> ${selected}\nYou travel to ${destination}.`;
        } else {
          output.textContent += `\n> ${selected}\nYou can't go that way.`;
        }
      } else {
        output.textContent += `\n> ${selected}\n${getResponse(selected)}`;
      }
    }

    function getResponse(command) {
      switch(command) {
        case "Look Around": return "You look around and take in the surroundings.";
        case "Talk to Local": return "You chat with a friendly local who tells you about the city.";
        case "Visit Art Gallery": return "You visit a gallery filled with beautiful Balinese artwork.";
        case "Surf the Waves": return "You rent a board and catch some waves!";
        case "Relax on Beach": return "You relax by the sea, enjoying the sun.";
        case "Feed the Monkeys": return "You toss some bananas to playful monkeys.";
        default: return "Nothing happens.";
      }
    }

    updateUI();
  </script>
</body>
</html>
