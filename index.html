<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indonesian Matching Quiz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: linear-gradient(to right, #d0eaff, #f0f8ff);
      text-align: center;
    }
    h1 {
      margin-bottom: 10px;
      color: #333;
    }
    #score {
      font-size: 18px;
      margin-bottom: 20px;
      color: #555;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      max-width: 700px;
      margin: 0 auto;
    }
    .btn {
      padding: 10px 15px;
      font-size: 16px;
      border: 2px solid #0099cc;
      border-radius: 8px;
      background-color: #ffffff;
      color: #333;
      transition: background-color 0.3s, transform 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      cursor: pointer;
    }
    .btn:hover {
      background-color: #e6f7ff;
      transform: scale(1.05);
    }
    .btn.correct {
      background-color: #d4edda;
      border-color: #28a745;
    }
    .btn.incorrect {
      background-color: #f8d7da;
      border-color: #dc3545;
    }
    .restart-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #28a745;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    .restart-btn:hover {
      background-color: #218838;
    }
    .sound-option {
      margin-top: 20px;
    }
    #startList {
      margin-bottom: 20px;
    }
    table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #f0f8ff;
    }
    td {
      background-color: #ffffff;
    }
    .clickable {
      color: #0099cc;
      cursor: pointer;
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .btn {
        font-size: 14px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>
  <h1>Indonesian-English Matching Game</h1>
  <div id="score">Score: 0</div>
  <div id="startList"></div>
  <div class="grid" id="gameArea"></div>
  <button class="restart-btn" onclick="restartGame()">Restart Game</button>

  <audio id="correctSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_1c71544389.mp3?filename=correct-2-46134.mp3"></audio>
  <audio id="incorrectSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_77cb648e15.mp3?filename=error-2-46045.mp3"></audio>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const pairs = [
 	['Terima kasih banyak', 'Thank you very much'],
      ['Terima kasih', 'Thank you'],
      ['Makasih.', 'Thanks'],
 ['Saya tidak mengerti', 'I dont understand formal'],
 ['nggak ngerti', 'I dont understand short'],
 ['Maaf', 'sorry'],
 ['tidak apa-apa.', 'its nothing'],
 ['Minta maaf', 'sorry med. formal'],
 ['mohon maaf', 'sorry high formal'],
 ['Ada berapa orang?', 'THere are how many people?'],
 ['seorang.', 'one person'],
 ['dua', '2'],
 ['tiga', '3'],
 ['satu', '1'],
 ['empat', '4 long'],
 ['pat', '4 short'],
 ['lima', '5'],
      ['Terima kasih atas bantuan Anda.', 'Thankyou very much for your help'],
      ['kembali', 'youre welcome'],
      ['Sama-sama', "same back"],
      ['Minta ini', 'This please'],
      ['Boleh minta ini?', 'May I have this please'],
      ['Selamat sore', 'Hello 3-6'],
      ['Selamat pagi', 'Good morning'],
      ['Selamat malam', 'Good night'],
      ['Selamat siang.', 'Hello 11-3'],
      ['Selamat tinggal', 'to person staying'],
      ['Selamat jalan', 'to person going'],
      ['sampai jumpa', 'Until we meet'],
      ['sampai nanti.', 'Until later'],
      ['Kamar kecil di mana?', 'WC where is it?'],
      ['di mana kamar kecil?', 'Where is the WC?'],
      ['Apa bisa berbahasa Inggris?', 'What can speak-language English'],
      ['Apa kabar?', 'How are you?'],
      ['Tolong', 'Please'],
      ['Maaf', "I'm sorry"],
      ['Saya tidak mengerti', "I don’t understand"],
      ['Bisa bantu saya?', 'Can you help me?'],
      ['Di mana kamar kecil?', 'Where is the bathroom?'],
      ['Berapa harganya?', 'How much is it?'],
      ['Apa ini?', 'What is this?'],
      ['Tidak', 'No'],
      ['Ya', 'Yes'],
      ['Nama saya...', 'My name is...'],
      ['Senang bertemu denganmu', 'Nice to meet you'],
      ['Permisi', 'Excuse me'],
      ['Saya lapar', "I'm hungry"],
      ['Saya haus', "I'm thirsty"],
      ['Ayo pergi', "Let's go"],
      ['Hati-hati', 'Be careful']
    ];

    let gamePairs = [...pairs];
    let currentBatch = [];
    let selected = [];
    let score = 0;
    let errorReview = [];
    let repeatCount = 3;  // Default repetition count
    let soundEnabled = true;  // Default sound enabled
    let startIndex = 0;  // Default start index

    const scoreDisplay = document.getElementById('score');
    const correctSound = document.getElementById('correctSound');
    const incorrectSound = document.getElementById('incorrectSound');
    const startList = document.getElementById('startList');

    // Show list of phrases in a table with clickable index
    function showStartList() {
      startList.innerHTML = '';
      let table = document.createElement('table');
      let tableHeader = `
        <tr>
          <th>Indonesian Phrase</th>
          <th>English Translation</th>
          <th>Select Start</th>
        </tr>
      `;
      table.innerHTML = tableHeader;

      pairs.forEach((pair, index) => {
        let row = document.createElement('tr');
        row.innerHTML = `
          <td>${pair[0]}</td>
          <td>${pair[1]}</td>
          <td><span class="clickable" onclick="startGame(${index})">Start from here</span></td>
        `;
        table.appendChild(row);
      });

      startList.appendChild(table);
    }

    // Start the game from selected phrase
    function startGame(index) {
      startIndex = index;
      startList.innerHTML = '';
      askForGameSettings(); // Now ask for repetition count and sound preference
    }

    // Ask user for the number of repetitions and sound preference
    function askForGameSettings() {
      let input = prompt("How many times do you want to hear the Indonesian phrases? (Enter a number, e.g., 3)");
      input = parseInt(input);
      if (isNaN(input) || input <= 0) {
        alert("Please enter a valid positive number. Defaulting to 3 repetitions.");
        repeatCount = 3;
      } else {
        repeatCount = input;
      }

      // Ask if user wants sound
      const soundChoice = confirm("Do you want sound enabled?");
      soundEnabled = soundChoice; // Set sound preference based on user input

      renderBatch(); // Start the game after settings
    }

    function updateScore(value) {
      score += value;
      scoreDisplay.textContent = `Score: ${score}`;
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function renderBatch() {
      const gameArea = document.getElementById('gameArea');
      gameArea.innerHTML = '';
      selected = [];

      if (gamePairs.length === 0 && errorReview.length === 0) {
        gameArea.innerHTML = '<h2>Congratulations! You matched all the phrases!</h2>';
        confetti();
        return;
      }

      if (errorReview.length > 0) {
        if (confirm("Do you want to retry your mistakes before continuing?")) {
          gamePairs = errorReview.concat(gamePairs);
          errorReview = [];
        }
      }

      currentBatch = gamePairs.splice(startIndex, 8); // Start at the chosen index
      const buttons = shuffle(
        currentBatch.flatMap(([ind, eng]) => [
          { type: 'ind', text: ind },
          { type: 'eng', text: eng }
        ])
      );

      buttons.forEach(btn => {
        const button = document.createElement('button');
        button.className = 'btn';
        button.textContent = btn.text;
        button.dataset.type = btn.type;
        button.addEventListener('click', () => {
          handleSelect(button);
          if (btn.type === 'ind') speakIndonesian(btn.text);
        });
        gameArea.appendChild(button);
      });
    }

    function handleSelect(button) {
      if (button.classList.contains('correct') || button.classList.contains('selected')) return;

      button.classList.add('selected');
      selected.push(button);

      if (selected.length === 2) {
        const [first, second] = selected;
        const pair = currentBatch.find(p =>
          (p[0] === first.textContent && p[1] === second.textContent) ||
          (p[1] === first.textContent && p[0] === second.textContent)
        );

        if (pair) {
          if (soundEnabled) correctSound.play();
          updateScore(1);
          first.classList.add('correct');
          second.classList.add('correct');
          setTimeout(() => {
            first.remove();
            second.remove();
            if (document.querySelectorAll('.btn').length === 0) {
              renderBatch();
            }
          }, 400);
        } else {
          if (soundEnabled) incorrectSound.play();
          updateScore(-1);
          errorReview.push([
            first.dataset.type === 'ind' ? first.textContent : second.textContent,
            first.dataset.type === 'eng' ? first.textContent : second.textContent
          ]);
          first.classList.add('incorrect');
          second.classList.add('incorrect');
          setTimeout(() => {
            first.classList.remove('selected', 'incorrect');
            second.classList.remove('selected', 'incorrect');
          }, 700);
        }
        selected = [];
      }
    }

    function speakIndonesian(text) {
      if (!soundEnabled) return;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'id-ID';

      let count = 0;
      utterance.onend = function() {
        count++;
        if (count < repeatCount) {
          speechSynthesis.speak(utterance);
        }
      };

      speechSynthesis.speak(utterance);
    }

    function restartGame() {
      gamePairs = [...pairs];
      errorReview = [];
      score = 0;
      updateScore(0);
      showStartList(); // Show the list again for choosing a start point
    }

    document.addEventListener('DOMContentLoaded', showStartList);
  </script>
</body>
</html>
