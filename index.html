<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bali Island Adventure</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
    #game-container { display: flex; flex-direction: column; max-width: 800px; margin: auto; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #image-panel { height: 200px; background-size: cover; background-position: center; border-radius: 10px; margin-bottom: 15px; }
    #output { white-space: pre-wrap; margin-bottom: 10px; background: #eef; padding: 10px; border-radius: 5px; max-height: 300px; overflow-y: auto; }
    #command-form { display: flex; gap: 10px; }
    #command { flex: 1; padding: 8px; }
    button, select { padding: 8px; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="image-panel"></div>
    <div id="output"></div>
    <form id="command-form">
      <input type="text" id="command" placeholder="Type a command..." />
      <button type="submit">Go</button>
    </form>
  </div>

  <script>
    // Locations setup
    const locations = {
      "Denpasar": {
        description: "You're in Denpasar, the capital of Bali. A busy and lively city.",
        directions: ["Ubud", "Kuta", "Sanur"],
        image: "https://via.placeholder.com/800x400?text=Denpasar",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
      },
      "Ubud": {
        description: "You're in Ubud, a center of culture and art.",
        directions: ["Denpasar", "Monkey Forest", "Tegallalang"],
        image: "https://via.placeholder.com/800x400?text=Ubud",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
      },
      "Kuta": {
        description: "You're in Kuta, known for its beautiful beaches and surfing spots.",
        directions: ["Denpasar"],
        image: "https://via.placeholder.com/800x400?text=Kuta",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
      },
      "Sanur": {
        description: "You're in Sanur, a peaceful seaside village.",
        directions: ["Denpasar"],
        image: "https://via.placeholder.com/800x400?text=Sanur",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
      },
      "Monkey Forest": {
        description: "You're in the Sacred Monkey Forest of Ubud. Monkeys are everywhere.",
        directions: ["Ubud"],
        image: "https://via.placeholder.com/800x400?text=Monkey+Forest",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
      },
      "Tegallalang": {
        description: "You're at the Tegallalang Rice Terraces. The view is amazing.",
        directions: ["Ubud"],
        image: "https://via.placeholder.com/800x400?text=Tegallalang",
        audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
      },
    };

    // Current game state
    let currentLocation = "Denpasar";

    // Update the game interface
    function updateUI() {
      const location = locations[currentLocation];
      document.getElementById("output").textContent = location.description;
      document.getElementById("image-panel").style.backgroundImage = `url('${location.image}')`;
      document.getElementById("audio").src = location.audio;
    }

    // Process the player's command
    function processCommand(command) {
      command = command.toLowerCase().trim();
      const location = locations[currentLocation];
      
      if (command === "exit") {
        return "Thank you for playing!";
      }

      if (command.startsWith("go ")) {
        const destination = command.slice(3).trim();
        if (location.directions.includes(destination)) {
          currentLocation = destination;
          updateUI();
          return `You travel to ${destination}.`;
        } else {
          return "You can't go that way.";
        }
      }

      return "Command not recognized.";
    }

    // Event listener for form submission
    document.getElementById("command-form").addEventListener("submit", function (event) {
      event.preventDefault();
      const command = document.getElementById("command").value;
      const result = processCommand(command);
      document.getElementById("output").textContent += `\n> ${command}\n${result}`;
      document.getElementById("command").value = "";  // Clear the input field
    });

    // Initialize the game UI
    updateUI();
  </script>
</body>
</html>
