 <!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connections: Indonesian Numbers</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      margin: 0;
      background-color: #f9f9f9;
    }

    h2 {
      text-align: center;
    }

    #solvedArea {
      margin-bottom: 20px;
    }

    .group-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
    }

    .group-row .word {
      background-color: lightgreen;
      border-color: green;
      pointer-events: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .word {
      padding: 12px;
      border: 2px solid #aaa;
      border-radius: 10px;
      background-color: #fff;
      text-align: center;
      cursor: pointer;
      font-size: 1rem;
      user-select: none;
      transition: 0.2s;
    }

    .selected {
      background-color: #ffe58f;
      border-color: #f0a500;
    }

    .correct {
      display: none; /* we'll move correct words to top instead */
    }

    #buttons {
      text-align: center;
      margin-top: 10px;
    }

    button {
      padding: 12px 20px;
      font-size: 1rem;
      margin: 5px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    #submitBtn {
      background-color: #4CAF50;
      color: white;
      display: none;
    }

    #resetBtn {
      background-color: #f44336;
      color: white;
    }

    #nextSetBtn {
      background-color: #2196F3;
      color: white;
      display: none;
    }

    #winMessage {
      text-align: center;
      font-weight: bold;
      font-size: 1.2em;
      color: green;
    }
  </style>
</head>
<body>
  <h2>Connections: Indonesian Numbers</h2>
  <div id="solvedArea"></div>
  <div class="grid" id="wordGrid"></div>

  <div id="buttons">
    <button id="submitBtn" onclick="submitSelection()">Submit</button>
    <button id="resetBtn" onclick="resetGame()">Reset</button>
    <button id="nextSetBtn" onclick="nextSet()">Next 16 Numbers</button>
  </div>

  <div id="winMessage"></div>

  <script>
    let startNum = 1;
    let selectedWords = [];
    let shuffledGroups = [];
    let solvedGroups = [];
    const grid = document.getElementById("wordGrid");
    const solvedArea = document.getElementById("solvedArea");
    const submitBtn = document.getElementById("submitBtn");
    const nextSetBtn = document.getElementById("nextSetBtn");
    const winMessage = document.getElementById("winMessage");

    function numberToIndo(n) {
      const base = [
        '', 'satu', 'dua', 'tiga', 'empat',
        'lima', 'enam', 'tujuh', 'delapan',
        'sembilan', 'sepuluh', 'sebelas'
      ];
      if (n <= 11) return base[n];
      if (n === 12) return 'dua belas';
      if (n < 20) return base[n - 10] + ' belas';
      if (n === 20) return 'dua puluh';
      const tens = Math.floor(n / 10);
      const units = n % 10;
      return base[tens] + ' puluh' + (units ? ' ' + base[units] : '');
    }

    function getIndoNumbers(start, count) {
      return Array.from({ length: count }, (_, i) => ({
        label: numberToIndo(start + i),
        value: start + i
      }));
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    function initGame() {
      selectedWords = [];
      solvedGroups = [];
      submitBtn.style.display = 'none';
      nextSetBtn.style.display = 'none';
      winMessage.textContent = '';
      solvedArea.innerHTML = '';
      grid.innerHTML = '';

      const numbers = getIndoNumbers(startNum, 16);
      shuffle(numbers);

      shuffledGroups = [];
      for (let i = 0; i < 4; i++) {
        shuffledGroups.push(numbers.slice(i * 4, (i + 1) * 4));
      }

      const flatWords = shuffledGroups.flat();
      shuffle(flatWords);

      flatWords.forEach(item => {
        const div = document.createElement('div');
        div.className = 'word';
        div.textContent = item.label;
        div.dataset.label = item.label;
        div.onclick = () => toggleWord(div);
        grid.appendChild(div);
      });
    }

    function toggleWord(el) {
      if (el.classList.contains('correct')) return;

      el.classList.toggle('selected');

      const label = el.dataset.label;
      if (el.classList.contains('selected')) {
        selectedWords.push(label);
      } else {
        selectedWords = selectedWords.filter(w => w !== label);
      }

      submitBtn.style.display = selectedWords.length === 4 ? 'inline-block' : 'none';
    }

    function submitSelection() {
      const sortedSelected = [...selectedWords].sort();

      let matchedGroup = null;

      for (const group of shuffledGroups) {
        const groupLabels = group.map(w => w.label).sort();
        if (JSON.stringify(groupLabels) === JSON.stringify(sortedSelected)) {
          matchedGroup = group;
          break;
        }
      }

      if (matchedGroup) {
        // Move matched group to solved area
        const row = document.createElement('div');
        row.className = 'group-row';
        matchedGroup.forEach(wordObj => {
          const w = document.createElement('div');
          w.className = 'word';
          w.textContent = wordObj.label;
          row.appendChild(w);
        });
        solvedArea.appendChild(row);

        // Hide matched elements from grid
        document.querySelectorAll('.word').forEach(el => {
          if (matchedGroup.find(w => w.label === el.dataset.label)) {
            el.classList.remove('selected');
            el.classList.add('correct');
          }
        });

        // Speak the words
        speakWords(matchedGroup.map(w => w.label));
        solvedGroups.push(matchedGroup);
      } else {
        // Not correct
        document.querySelectorAll('.selected').forEach(el => el.classList.remove('selected'));
      }

      selectedWords = [];
      submitBtn.style.display = 'none';

      if (solvedGroups.length === 4) {
        winMessage.textContent = "You solved all groups!";
        nextSetBtn.style.display = 'inline-block';
      }
    }

    function speakWords(words) {
      words.forEach((word, i) => {
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'id-ID';
        utter.rate = 0.9;
        setTimeout(() => speechSynthesis.speak(utter), i * 800);
      });
    }

    function resetGame() {
      initGame();
    }

    function nextSet() {
      startNum += 16;
      initGame();
    }

    initGame();
  </script>
</body>
</html>
