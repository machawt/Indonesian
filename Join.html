<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strands Clone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background-color: #000;
      color: white;
      width: 100%;
      padding: 1rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .game-container {
      max-width: 600px;
      width: 100%;
      margin-top: 2rem;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
      padding: 0 1rem;
    }
    .tile {
      background-color: white;
      border: 1px solid #ccc;
      padding: 1rem;
      text-align: center;
      font-size: 1.2rem;
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: background-color 0.3s, color 0.3s, opacity 0.5s;
    }
    .tile.selected {
      background-color: #007aff;
      color: white;
    }
    .tile.found {
      opacity: 0.4;
      pointer-events: none;
    }
    #wordOutput {
      margin-top: 1rem;
      font-size: 1.2rem;
      color: #333;
    }
    #submitBtn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: #007aff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #hints {
      margin-top: 1rem;
      font-size: 1rem;
      color: #555;
      max-width: 600px;
      padding: 0 1rem;
    }
    .hint-item.hidden {
      display: none;
    }
    .hint-item.visible {
      display: block;
    }
    footer {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #777;
      text-align: center;
      padding: 1rem;
    }
    @media (max-width: 600px) {
      .tile {
        padding: 0.8rem;
        font-size: 1rem;
      }
      header {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    Strands Clone
  </header>
  <div class="game-container" id="gameContainer"></div>
  <button id="submitBtn">Submit Word</button>
  <div id="wordOutput"></div>
  <div id="hints">
    <strong>Hints:</strong>
    <ul id="hintsList"></ul>
  </div>
  <footer>
    Inspired by The New York Times Strands
  </footer>  <script>
    const gridSize = 6;
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const container = document.getElementById('gameContainer');
    const wordOutput = document.getElementById('wordOutput');
    const selectedTiles = [];
    const foundWords = new Set();
    const hintsList = document.getElementById('hintsList');

    const wordSets = [
      {
        words: {
          "AKU": "I",
          "kembali": "You",
          "DIA": "He/She",
          "KITA": "We",
          "MEREKA": "They",
          "INI": "This",
          "ITU": "That",
          "APA": "What",
          "DIMANA": "Where",
          "KENAPA": "Why"
        }
      },
      {
        words: {
          "MAKAN": "Eat",
          "MINUM": "Drink",
          "TIDUR": "Sleep",
          "JALAN": "Walk",
          "BELI": "Buy",
          "CINTA": "Love",
          "SUKA": "Like",
          "TAHU": "Know",
          "BISA": "Can",
          "ADA": "Exist/There is"
        }
      }
    ];

    let currentSetIndex = 0;
    let validWords = wordSets[currentSetIndex].words;

    function createHints(words) {
      hintsList.innerHTML = '';
      Object.entries(words).forEach(([word, translation]) => {
        const li = document.createElement('li');
        li.textContent = `${word} - ${translation}`;
        li.classList.add('hint-item', 'hidden');
        li.id = `hint-${word}`;
        hintsList.appendChild(li);
      });
    }

    function placeWordsInGrid(words) {
      const grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(''));
      const directions = [
        { dx: 1, dy: 0 }, // right
        { dx: -1, dy: 0 }, // left
        { dx: 0, dy: 1 }, // down
        { dx: 0, dy: -1 }, // up
        { dx: 1, dy: 1 }, // diagonal down-right
        { dx: -1, dy: -1 }, // diagonal up-left
        { dx: 1, dy: -1 }, // diagonal up-right
        { dx: -1, dy: 1 } // diagonal down-left
      ];

      for (const word of Object.keys(words)) {
        let placed = false;
        let attempts = 0;

        while (!placed && attempts < 100) {
          attempts++;
          const dir = directions[Math.floor(Math.random() * directions.length)];
          const startX = dir.dx > 0 ? 0 : word.length - 1;
          const startY = dir.dy > 0 ? 0 : word.length - 1;

          const x = Math.floor(Math.random() * (gridSize - Math.abs(dir.dx) * word.length + 1) + (dir.dx < 0 ? word.length - 1 : 0));
          const y = Math.floor(Math.random() * (gridSize - Math.abs(dir.dy) * word.length + 1) + (dir.dy < 0 ? word.length - 1 : 0));

          let fits = true;
          for (let i = 0; i < word.length; i++) {
            const nx = x + i * dir.dx;
            const ny = y + i * dir.dy;
            if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize || (grid[ny][nx] && grid[ny][nx] !== word[i])) {
              fits = false;
              break;
            }
          }

          if (fits) {
            for (let i = 0; i < word.length; i++) {
              const nx = x + i * dir.dx;
              const ny = y + i * dir.dy;
              grid[ny][nx] = word[i];
            }
            placed = true;
          }
        }
      }

      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          if (!grid[y][x]) {
            grid[y][x] = letters[Math.floor(Math.random() * letters.length)];
          }
        }
      }

      return grid;
    }

    function drawGrid(grid) {
      container.innerHTML = '';
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.textContent = grid[y][x];
          tile.dataset.x = x;
          tile.dataset.y = y;
          container.appendChild(tile);
        }
      }
    }

    function loadSet(index) {
      currentSetIndex = index;
      validWords = wordSets[currentSetIndex].words;
      foundWords.clear();
      createHints(validWords);
      const grid = placeWordsInGrid(validWords);
      drawGrid(grid);
      wordOutput.textContent = '';
    }

    function resetSelection() {
      document.querySelectorAll('.tile.selected').forEach(tile => tile.classList.remove('selected'));
      selectedTiles.length = 0;
    }

    container.addEventListener('click', e => {
      if (e.target.classList.contains('tile')) {
        e.target.classList.toggle('selected');
        if (e.target.classList.contains('selected')) {
          selectedTiles.push(e.target);
        } else {
          const index = selectedTiles.indexOf(e.target);
          if (index > -1) selectedTiles.splice(index, 1);
        }
      }
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      const word = selectedTiles.map(tile => tile.textContent).join('');
      const reversedWord = [...word].reverse().join('');
      if ((validWords[word] || validWords[reversedWord]) && !foundWords.has(word) && !foundWords.has(reversedWord)) {
        const match = validWords[word] ? word : reversedWord;
        wordOutput.textContent = `Correct! "${match}" is a valid Indonesian word.`;
        foundWords.add(match);
        const hintItem = document.getElementById(`hint-${match}`);
        if (hintItem) {
          hintItem.classList.remove('hidden');
          hintItem.classList.add('visible');
        }
        selectedTiles.forEach(tile => {
          tile.classList.remove('selected');
          tile.classList.add('found');
        });
        selectedTiles.length = 0;

        if (foundWords.size === Object.keys(validWords).length) {
          setTimeout(() => {
            if (currentSetIndex + 1 < wordSets.length) {
              wordOutput.textContent = 'New word set unlocked!';
              loadSet(currentSetIndex + 1);
            } else {
              wordOutput.textContent = 'Congratulations! All word sets completed!';
            }
          }, 1500);
        }
      } else if (foundWords.has(word) || foundWords.has(reversedWord)) {
        wordOutput.textContent = `You already found "${word}".`;
      } else {
        wordOutput.textContent = `"${word}" is not a valid Indonesian word.`;
      }
    });

    loadSet(currentSetIndex);
  </script></body>
</html>
